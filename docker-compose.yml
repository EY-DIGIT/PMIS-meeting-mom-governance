# Meetings & MoM Governance module.
#
#   docker compose build              # build the app image
#   docker compose up --build app     # build + run the app (uses the configured pmis_db by default)
#   docker compose up -d postgres     # (optional) run a local PostgreSQL 16 instead
#   docker compose down               # stop (keeps the postgres volume; add -v to wipe)
services:
  app:
    build: .
    image: meetings-mom-governance:latest
    container_name: meetings-mom-app
    ports:
      - "8080:8080"
    environment:
      # By default the app uses the datasource baked into application.properties
      # (the shared pmis_db at 10.1.131.199). Override here as needed, e.g. to use
      # the bundled "postgres" service below, uncomment these and the depends_on:
      # DB_URL: jdbc:postgresql://postgres:5432/postgres
      # DB_USERNAME: postgres
      # DB_PASSWORD: postgres
      SERVER_PORT: "8080"
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # Optional local PostgreSQL 16 (only used if you point DB_URL at it above).
  postgres:
    image: postgres:16
    container_name: meetings-mom-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - meetings_mom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meetings_mom_pgdata:
