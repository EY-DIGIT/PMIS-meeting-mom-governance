spring:
  datasource:
    # INIT creates the 'meetings' schema so the shared hibernate.default_schema
    # (set in application.properties) resolves under H2 too.
    url: jdbc:h2:mem:uidai_mom;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS meetings
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

external:
  user-service:
    enabled: false
    base-url: http://localhost:9001
  activity-service:
    enabled: false
    base-url: http://localhost:9002
