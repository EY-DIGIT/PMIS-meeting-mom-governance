# Application
spring.application.name=meetings-mom-governance

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (schema is owned by Flyway migrations; Hibernate neither creates nor validates it)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/meetings

# External Python services (User & Activity). Base URLs and endpoint paths are
# externally configurable here.
# Users service: GET /users (paginated), GET /users/{id}, etc.
external.user-service.base-url=${USER_SERVICE_URL:http://10.1.131.199/users/api/v3}
external.user-service.enabled=${USER_SERVICE_ENABLED:true}
external.user-service.connect-timeout-ms=3000
external.user-service.read-timeout-ms=5000
# Endpoint paths (relative to base-url). Keep the {placeholders}; they are expanded
# with the call arguments at runtime.
external.user-service.endpoints[get-user]=/users/{id}
external.user-service.endpoints[list-users]=/users
# Project Activities service: GET/PATCH /activities/{id}
external.activity-service.base-url=${ACTIVITY_SERVICE_URL:http://10.1.131.199/projects/api/v3}
external.activity-service.enabled=${ACTIVITY_SERVICE_ENABLED:true}
external.activity-service.connect-timeout-ms=3000
external.activity-service.read-timeout-ms=5000
external.activity-service.endpoints[create-activity]=/milestones/{milestoneId}/activities/create
external.activity-service.endpoints[get-activity]=/activities/{id}
external.activity-service.endpoints[update-activity]=/activities/{id}

# springdoc / Swagger UI. The UI is exposed at /meetings/docs via a forward
# (see SwaggerUiController) so the browser stays on that URL instead of being
# redirected to /swagger-ui/index.html.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=false

# Actuator
management.endpoints.web.exposure.include=health,info
