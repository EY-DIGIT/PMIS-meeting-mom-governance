# Application
spring.application.name=meetings-mom-governance

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://10.1.131.199:5432/pmis_db}
spring.datasource.username=${DB_USERNAME:pmis_user}
spring.datasource.password=${DB_PASSWORD:aadhaarpmis2026}
spring.datasource.driver-class-name=org.postgresql.Driver
# Resolve unqualified object names (incl. native queries like nextval('meeting_code_seq'))
# against the module schema first, then public for any shared objects.
spring.datasource.hikari.connection-init-sql=SET search_path TO ${DB_SCHEMA:meetings}, public

# JPA / Hibernate (schema is owned by Flyway migrations; Hibernate neither creates nor validates it).
# Hibernate resolves unqualified table names against the 'meetings' schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:meetings}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Run all module migrations in a dedicated 'meetings' schema (created if absent)
# instead of the shared public schema. The flyway_schema_history table also
# lives here, and unqualified DDL in the migrations resolves to this schema.
spring.flyway.schemas=${DB_SCHEMA:meetings}
spring.flyway.default-schema=${DB_SCHEMA:meetings}
spring.flyway.create-schemas=true

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/meetings
# Allow large JSON request bodies: base64-encoded attachments inflate ~33%
# (a 25 MB file -> ~34 MB JSON), and a meeting may carry several files.
server.tomcat.max-swallow-size=64MB
server.tomcat.max-http-form-post-size=64MB

# External Python services (User & Activity). Base URLs and endpoint paths are
# externally configurable here.
# Users service: GET /users (paginated), GET /users/{id}, etc.
external.user-service.base-url=${USER_SERVICE_URL:http://10.1.131.199/users/api/v3}
external.user-service.enabled=${USER_SERVICE_ENABLED:true}
external.user-service.connect-timeout-ms=3000
external.user-service.read-timeout-ms=5000
# Endpoint paths (relative to base-url). Keep the {placeholders}; they are expanded
# with the call arguments at runtime.
external.user-service.endpoints[get-user]=/users/{id}
external.user-service.endpoints[list-users]=/users
# Project Activities service: GET/PATCH /activities/{id}
external.activity-service.base-url=${ACTIVITY_SERVICE_URL:http://10.1.131.199/projects/api/v3}
external.activity-service.enabled=${ACTIVITY_SERVICE_ENABLED:true}
external.activity-service.connect-timeout-ms=5000
# Generous read timeout: activity-create may upload large base64 attachments.
external.activity-service.read-timeout-ms=${ACTIVITY_READ_TIMEOUT_MS:60000}
external.activity-service.endpoints[create-activity]=/milestones/{milestoneId}/activities/create
external.activity-service.endpoints[get-activity]=/activities/{id}
external.activity-service.endpoints[update-activity]=/activities/{id}
external.activity-service.endpoints[get-project]=/projects/{id}

# springdoc / Swagger UI. The UI is exposed at /meetings/docs via a forward
# (see SwaggerUiController) so the browser stays on that URL instead of being
# redirected to /swagger-ui/index.html.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=false

# Actuator
management.endpoints.web.exposure.include=health,info
