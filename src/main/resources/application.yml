spring:
  application:
    name: meetings-mom-governance
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uidai_mom}
    username: ${DB_USERNAME:uidai}
    password: ${DB_PASSWORD:uidai}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations; Hibernate neither creates nor validates it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# External Python services (User & Activity). Endpoint signatures are filled in
# once provided; base URLs and paths are externally configurable here.
external:
  # Users service: GET /users (paginated), GET /users/{id}, etc.
  user-service:
    base-url: ${USER_SERVICE_URL:http://10.1.131.199/users/api/v3}
    enabled: ${USER_SERVICE_ENABLED:true}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  # Project Activities service: GET/PATCH /activities/{id}
  activity-service:
    base-url: ${ACTIVITY_SERVICE_URL:http://10.1.131.199/projects/api/v3}
    enabled: ${ACTIVITY_SERVICE_ENABLED:true}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
